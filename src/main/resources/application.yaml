info:
  application:
    name: ${spring.application.name}
    description: '@project.description@'
    version: '@project.version@'

spring:
  aplication:
    name: "quick-pay-bank"
  main:
    banner-mode: "off"
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:3306/quickpay
    username: ${DB_USER}
    password: ${DB_PASSWD}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true