services:

  mysql:
    image: mysql:8.0
    container_name: quickpay-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: quickpay
      MYSQL_USER: qpayuser
      MYSQL_PASSWORD: qpaypaswd
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build: .
    container_name: quickpay-app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_USER: qpayuser
      DB_PASSWD: qpaypaswd
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
